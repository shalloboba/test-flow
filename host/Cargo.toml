[package]
name = "radial-menu"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "RadialMenu"
path = "src/main.rs"

[dependencies]
fontdue = "0.9.5"
radial-core = { version = "0.3.0", path = "../core" }
tiny-skia = "0.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Shutdown"] }

[build-dependencies]
embed-resource = "3.0.12"
